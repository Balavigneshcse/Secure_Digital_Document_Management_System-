version: "3.8"

# NOTE ON SCOPE: this compose file brings up Keycloak and blockchain-api
# together. It deliberately does NOT try to fold in the Hyperledger Fabric
# test-network — that network generates its own crypto material and docker
# network dynamically via `./network.sh up`, and re-implementing that here
# would fight the official fabric-samples tooling rather than reuse it.
#
# Bring the Fabric network up separately first (see README), then start this
# compose file. If you want blockchain-api to run in a container (rather
# than directly on the host with `npm start`), join it to Fabric's docker
# network and set FABRIC_DISCOVERY_AS_LOCALHOST=false in .env — see the
# commented-out network config below.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: sentineldms-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  blockchain-api:
    build:
      context: ./services/blockchain-api
    container_name: sentineldms-blockchain-api
    env_file:
      - ./services/blockchain-api/.env
    ports:
      - "4000:4000"
    volumes:
      - ./services/blockchain-api/wallet:/app/wallet
      - ./services/blockchain-api/ca:/app/ca
      - ./services/blockchain-api/config:/app/config
      - ./services/blockchain-api/storage:/app/storage
    depends_on:
      - keycloak
    # To let this container reach the Fabric peers started by
    # fabric-samples/test-network, uncomment the two lines below and set
    # FABRIC_DISCOVERY_AS_LOCALHOST=false in your .env. The network name
    # comes from `docker network ls` after running `./network.sh up` —
    # it's typically "fabric_test" but confirm on your machine.
    # networks:
    #   - fabric_test

# networks:
#   fabric_test:
#     external: true
